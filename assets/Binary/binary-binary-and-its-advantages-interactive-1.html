<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Binary and Its Advantages interactive 1</title>
  <script src="../iframe-resizer.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }
    img.center {
      display: block;
      margin-left: auto;
      margin-right: auto;
      width: 100%;
      height: 100%;
      object-fit: cover; /* Controls how the image resizes */
    }
  </style>
</head>
<body>
<img class="center" src="Images/OffSwitch.gif" id="binary-switch" />
<script>
  const binarySwitch = document.getElementById("binary-switch");
  binarySwitch.addEventListener("mouseover", () => {
    binarySwitch.src = "Images/OnSwitch.gif";
  });
  binarySwitch.addEventListener("mouseout", () => {
    binarySwitch.src = "Images/OffSwitch.gif";
  });
</script>
</body>
</html>
